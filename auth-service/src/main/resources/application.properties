server.port=8801
spring.application.name=gm-user

# EUREKA SERVER
spring.cloud.discovery.enabled=false

#DATA SOURCE
#spring.datasource.url=jdbc:mysql://54.252.244.31:3306/gm_users
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/gm_users
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#EUREKA CLIENT
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}


#KAFKA STREAM
spring.cloud.stream.instanceCount=1
spring.cloud.stream.instanceIndex=0
spring.cloud.stream.default-binder=kafka
#spring.cloud.stream.kafka.binder.brokers=10.1.39.170:9092,10.1.39.171:9092,10.1.39.172:9092
spring.cloud.stream.kafka.binder.defaultBrokerPort=9092
spring.cloud.stream.kafka.binder.replication-factor=1
spring.cloud.stream.default.contentType=application/json

#kafka consumers
spring.cloud.function.definition=handleCreatePost

# consumer handleCreatePost
spring.cloud.stream.bindings.handleCreatePost-in-0.destination=APP_POST_INFO
spring.cloud.stream.bindings.handleCreatePost-in-0.group=AUDIT_POST_GROUP
spring.cloud.stream.bindings.handleCreatePost-in-0.consumer.concurrency=13
spring.cloud.stream.bindings.handleCreatePost-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.handleCreatePost-in-0.consumer.backOffInitialInterval=500
spring.cloud.stream.bindings.handleCreatePost-in-0.backOffMaxInterval=1000
spring.cloud.stream.bindings.handleCreatePost-in-0.consumer.backOffMultiplier=2.0
spring.cloud.stream.kafka.bindings.handleCreatePost-in-0.consumer.enableDlq=true